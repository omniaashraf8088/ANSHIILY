name: anshiily
description: "ANSHIILY - From Idea to Design | من فكرة إلى تصميم"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  supabase_flutter: ^2.18.3
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  image: ^4.5.2
  purchases_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B132B"
  adaptive_icon_foreground: "assets/brand/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/brand/app_icon.png
    - assets/brand/splash_screen.png
    - assets/brand/original_logo.png

