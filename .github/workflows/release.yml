name: ANSHIILY Production Release Pipeline

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Pre-Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static Code Analysis
        run: flutter analyze

      - name: Execute Full Test Suite
        run: flutter test

  build-android-release:
    name: Build Android Production Artifacts
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore (If Secrets Available)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/anshiily-release.jks
            cat <<EOF > android/key.properties
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=../anshiily-release.jks
          EOF
          else
            echo "Production keystore secret not configured. Proceeding with fallback signing."
          fi

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build Universal Release APK (.apk)
        run: flutter build apk --release

      - name: Archive Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: anshiily-app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: anshiily-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
